<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F5F8" />
      <stop offset="100%" stop-color="#DEE5EC" />
    </radialGradient>
    <radialGradient id="lapisGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4B77BE" />
      <stop offset="40%" stop-color="#1B3A6B" />
      <stop offset="85%" stop-color="#0E2344" />
      <stop offset="100%" stop-color="#061226" />
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E2344" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <ellipse cx="400" cy="400" rx="220" ry="160" fill="none" stroke="url(#silverGrad)" stroke-width="6" opacity="0.6" />

  <g id="beads">
    <circle cx="400" cy="240" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <!-- Pyrite Gold flecks -->
    <circle cx="390" cy="235" r="2" fill="#FFE082" />
    <circle cx="405" cy="245" r="1.5" fill="#FFE082" />
    <ellipse cx="388" cy="226" rx="9" ry="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-20 388 226)" />

    <circle cx="480" cy="255" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <circle cx="545" cy="290" r="22" fill="url(#silverGrad)" filter="url(#softShadow)" />

    <circle cx="595" cy="345" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <circle cx="610" cy="425" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <circle cx="570" cy="495" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    
    <circle cx="500" cy="535" r="22" fill="url(#silverGrad)" filter="url(#softShadow)" />

    <!-- Center Crescent Moon Silver Charm -->
    <g transform="translate(400, 560)">
      <circle cx="0" cy="28" r="5" fill="url(#silverGrad)" />
      <path d="M-8,35 A22,22 0 1,0 18,72 A28,28 0 1,1 -8,35 Z" fill="url(#silverGrad)" filter="url(#softShadow)" />
    </g>

    <circle cx="300" cy="535" r="22" fill="url(#silverGrad)" filter="url(#softShadow)" />
    <circle cx="230" cy="495" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <circle cx="190" cy="425" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    <circle cx="205" cy="345" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
    
    <circle cx="255" cy="290" r="22" fill="url(#silverGrad)" filter="url(#softShadow)" />
    <circle cx="320" cy="255" r="32" fill="url(#lapisGrad)" filter="url(#softShadow)" />
  </g>

  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#0E2344" opacity="0.25" text-anchor="middle" letter-spacing="4">
    JOY’S ATELIER
  </text>
  <text x="400" y="425" font-family="'Source Sans 3', sans-serif" font-size="10" font-weight="600" fill="#0E2344" opacity="0.2" text-anchor="middle" letter-spacing="6">
    CELESTIAL LAPIS LAZULI &amp; SILVER
  </text>
</svg>
