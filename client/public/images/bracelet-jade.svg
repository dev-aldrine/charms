<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F1EA" />
      <stop offset="100%" stop-color="#E8E2D6" />
    </radialGradient>
    <radialGradient id="jadeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8DB89A" />
      <stop offset="40%" stop-color="#4E7D5B" />
      <stop offset="90%" stop-color="#284E34" />
      <stop offset="100%" stop-color="#1B3322" />
    </radialGradient>
    <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="75%" stop-color="#B38F24" />
      <stop offset="100%" stop-color="#735810" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D3A31" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Neutral Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <!-- Subtle Organic Linen Texture Lines -->
  <g stroke="#2D3A31" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>

  <!-- Main Shadow -->
  <ellipse cx="400" cy="420" rx="230" ry="170" fill="#2D3A31" opacity="0.08" filter="url(#softShadow)" />

  <!-- Bracelet Cord / Ring -->
  <ellipse cx="400" cy="400" rx="220" ry="160" fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.6" />

  <!-- Beads Loop (Jade & Gold Rondelles) -->
  <g id="beads">
    <!-- Bead 1 Top -->
    <circle cx="400" cy="240" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <ellipse cx="390" cy="228" rx="10" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 390 228)" />

    <!-- Bead 2 Top Right -->
    <circle cx="480" cy="255" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <ellipse cx="470" cy="243" rx="10" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 470 243)" />

    <!-- Gold Rondelle -->
    <circle cx="545" cy="290" r="22" fill="url(#goldGrad)" filter="url(#softShadow)" />

    <!-- Bead 3 Right -->
    <circle cx="595" cy="345" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <!-- Bead 4 Bottom Right -->
    <circle cx="610" cy="425" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <!-- Bead 5 Bottom Right -->
    <circle cx="570" cy="495" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    
    <!-- Gold Rondelle -->
    <circle cx="500" cy="535" r="22" fill="url(#goldGrad)" filter="url(#softShadow)" />

    <!-- Bead 6 Bottom Center -->
    <circle cx="400" cy="560" r="34" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    
    <!-- Center Gold Artisan Leaf Charm Pendant -->
    <g transform="translate(400, 560)">
      <circle cx="0" cy="30" r="6" fill="url(#goldGrad)" />
      <path d="M0,35 Q25,65 0,105 Q-25,65 0,35 Z" fill="url(#goldGrad)" filter="url(#softShadow)" />
      <line x1="0" y1="45" x2="0" y2="95" stroke="#735810" stroke-width="2" />
    </g>

    <!-- Bead 7 Bottom Left -->
    <circle cx="300" cy="535" r="22" fill="url(#goldGrad)" filter="url(#softShadow)" />
    <circle cx="230" cy="495" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <circle cx="190" cy="425" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <circle cx="205" cy="345" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    
    <!-- Gold Rondelle -->
    <circle cx="255" cy="290" r="22" fill="url(#goldGrad)" filter="url(#softShadow)" />

    <!-- Bead 8 Top Left -->
    <circle cx="320" cy="255" r="32" fill="url(#jadeGrad)" filter="url(#softShadow)" />
    <ellipse cx="310" cy="243" rx="10" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 310 243)" />
  </g>

  <!-- Luxury Brand Monogram Watermark -->
  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#2D3A31" opacity="0.25" text-anchor="middle" letter-spacing="4">
    JOY’S ATELIER
  </text>
  <text x="400" y="425" font-family="'Source Sans 3', sans-serif" font-size="10" font-weight="600" fill="#2D3A31" opacity="0.2" text-anchor="middle" letter-spacing="6">
    BURMESE JADEITE
  </text>
</svg>
