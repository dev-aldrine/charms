<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EFEFEF" />
      <stop offset="100%" stop-color="#DCDCDC" />
    </radialGradient>
    <radialGradient id="obsidianGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="40%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#050709" />
    </radialGradient>
    <radialGradient id="lavaGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="70%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>
    <radialGradient id="gunmetalGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <ellipse cx="400" cy="400" rx="220" ry="160" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />

  <g id="beads">
    <circle cx="400" cy="240" r="34" fill="url(#obsidianGrad)" filter="url(#softShadow)" />
    <ellipse cx="388" cy="226" rx="10" ry="4" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 388 226)" />

    <circle cx="480" cy="255" r="34" fill="url(#lavaGrad)" filter="url(#softShadow)" />
    <circle cx="545" cy="290" r="24" fill="url(#gunmetalGrad)" filter="url(#softShadow)" />

    <circle cx="595" cy="345" r="34" fill="url(#obsidianGrad)" filter="url(#softShadow)" />
    <circle cx="610" cy="425" r="34" fill="url(#lavaGrad)" filter="url(#softShadow)" />
    <circle cx="570" cy="495" r="34" fill="url(#obsidianGrad)" filter="url(#softShadow)" />
    
    <circle cx="500" cy="535" r="24" fill="url(#gunmetalGrad)" filter="url(#softShadow)" />

    <!-- Center Titanium Cylinder Tag -->
    <rect x="360" y="540" width="80" height="36" rx="18" fill="url(#gunmetalGrad)" filter="url(#softShadow)" />
    <text x="400" y="563" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">JOY</text>

    <circle cx="300" cy="535" r="24" fill="url(#gunmetalGrad)" filter="url(#softShadow)" />
    <circle cx="230" cy="495" r="34" fill="url(#obsidianGrad)" filter="url(#softShadow)" />
    <circle cx="190" cy="425" r="34" fill="url(#lavaGrad)" filter="url(#softShadow)" />
    <circle cx="205" cy="345" r="34" fill="url(#obsidianGrad)" filter="url(#softShadow)" />
    
    <circle cx="255" cy="290" r="24" fill="url(#gunmetalGrad)" filter="url(#softShadow)" />
    <circle cx="320" cy="255" r="34" fill="url(#lavaGrad)" filter="url(#softShadow)" />
  </g>

  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#1A202C" opacity="0.25" text-anchor="middle" letter-spacing="4">
    JOY’S ATELIER
  </text>
  <text x="400" y="425" font-family="'Source Sans 3', sans-serif" font-size="10" font-weight="600" fill="#1A202C" opacity="0.2" text-anchor="middle" letter-spacing="6">
    VOLCANIC OBSIDIAN &amp; ONYX
  </text>
</svg>
