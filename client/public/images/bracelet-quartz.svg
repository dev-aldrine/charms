<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FBF8F5" />
      <stop offset="100%" stop-color="#EFE6DE" />
    </radialGradient>
    <radialGradient id="roseQuartzGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE8EC" />
      <stop offset="40%" stop-color="#E8B4B8" />
      <stop offset="80%" stop-color="#C28287" />
      <stop offset="100%" stop-color="#8F545A" />
    </radialGradient>
    <radialGradient id="pearlGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F7F1E5" />
      <stop offset="85%" stop-color="#DCD1BF" />
      <stop offset="100%" stop-color="#B5A48F" />
    </radialGradient>
    <linearGradient id="silverVermeil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="50%" stop-color="#DFC489" />
      <stop offset="100%" stop-color="#A88B47" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D3A31" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <!-- Shadow of Sculpted Cuff -->
  <path d="M260,260 C180,340 180,480 260,560 C340,640 460,640 540,560 C620,480 620,340 540,260" fill="none" stroke="#2D3A31" stroke-width="28" stroke-linecap="round" opacity="0.08" filter="url(#softShadow)" transform="translate(0, 15)" />

  <!-- Open Sculpted Metal Cuff (925 Vermeil) -->
  <path d="M260,260 C180,340 180,480 260,560 C340,640 460,640 540,560 C620,480 620,340 540,260" fill="none" stroke="url(#silverVermeil)" stroke-width="24" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Left Gem Terminal: Raw Rose Quartz Cabochon -->
  <g transform="translate(260, 260)">
    <circle cx="0" cy="0" r="42" fill="url(#roseQuartzGrad)" filter="url(#softShadow)" />
    <ellipse cx="-12" cy="-12" rx="14" ry="7" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 -12 -12)" />
    <!-- Metal Prongs -->
    <circle cx="0" cy="-42" r="6" fill="url(#silverVermeil)" />
    <circle cx="0" cy="42" r="6" fill="url(#silverVermeil)" />
    <circle cx="-42" cy="0" r="6" fill="url(#silverVermeil)" />
  </g>

  <!-- Right Gem Terminal: Baroque Freshwater Pearl -->
  <g transform="translate(540, 260)">
    <path d="M-36,0 C-36,-38 0,-46 36,-36 C50,0 36,44 0,42 C-36,40 -40,15 -36,0 Z" fill="url(#pearlGrad)" filter="url(#softShadow)" />
    <ellipse cx="6" cy="-12" rx="16" ry="8" fill="#FFFFFF" opacity="0.75" transform="rotate(-15 6 -12)" />
  </g>

  <!-- Brand Monogram -->
  <text x="400" y="440" font-family="'Playfair Display', Georgia, serif" font-size="26" font-style="italic" fill="#2D3A31" opacity="0.25" text-anchor="middle" letter-spacing="4">
    JOY’S ATELIER
  </text>
  <text x="400" y="465" font-family="'Source Sans 3', sans-serif" font-size="10" font-weight="600" fill="#2D3A31" opacity="0.2" text-anchor="middle" letter-spacing="6">
    ROSE QUARTZ &amp; PEARL CUFF
  </text>
</svg>
