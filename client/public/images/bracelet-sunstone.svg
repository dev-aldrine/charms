<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F5EFE0" />
    </radialGradient>
    <radialGradient id="sunstoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFD6A5" />
      <stop offset="40%" stop-color="#FF9E54" />
      <stop offset="80%" stop-color="#D96820" />
      <stop offset="100%" stop-color="#9E3B00" />
    </radialGradient>
    <radialGradient id="amberGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFEBB3" />
      <stop offset="40%" stop-color="#E5A93C" />
      <stop offset="85%" stop-color="#B87314" />
      <stop offset="100%" stop-color="#734100" />
    </radialGradient>
    <linearGradient id="goldChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#997510" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#734100" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <ellipse cx="400" cy="400" rx="220" ry="160" fill="none" stroke="url(#goldChain)" stroke-width="8" stroke-dasharray="16 6" filter="url(#softShadow)" />

  <g id="facetedGems">
    <polygon points="400,210 425,240 400,270 375,240" fill="url(#sunstoneGrad)" filter="url(#softShadow)" />
    <ellipse cx="395" cy="235" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" />

    <circle cx="480" cy="255" r="24" fill="url(#amberGrad)" filter="url(#softShadow)" />
    
    <polygon points="595,345 625,370 595,395 565,370" fill="url(#sunstoneGrad)" filter="url(#softShadow)" />
    <circle cx="610" cy="450" r="24" fill="url(#amberGrad)" filter="url(#softShadow)" />
    <polygon points="550,515 575,540 550,565 525,540" fill="url(#sunstoneGrad)" filter="url(#softShadow)" />

    <!-- Center Solstice Sun Pendant -->
    <g transform="translate(400, 560)">
      <circle cx="0" cy="30" r="28" fill="url(#goldChain)" filter="url(#softShadow)" />
      <!-- Sun Rays -->
      <path d="M0, -6 L0, 10 M0, 50 L0, 66 M-28, 30 L-12, 30 M28, 30 L12, 30 M-20, 10 L-8, 22 M20, 50 L8, 38 M-20, 50 L-8, 38 M20, 10 L8, 22" stroke="#FFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="30" r="12" fill="url(#sunstoneGrad)" />
    </g>

    <polygon points="250,515 275,540 250,565 225,540" fill="url(#sunstoneGrad)" filter="url(#softShadow)" />
    <circle cx="190" cy="450" r="24" fill="url(#amberGrad)" filter="url(#softShadow)" />
    <polygon points="205,345 235,370 205,395 175,370" fill="url(#sunstoneGrad)" filter="url(#softShadow)" />
    <circle cx="320" cy="255" r="24" fill="url(#amberGrad)" filter="url(#softShadow)" />
  </g>

  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#734100" opacity="0.25" text-anchor="middle" letter-spacing="4">
    JOY’S ATELIER
  </text>
  <text x="400" y="425" font-family="'Source Sans 3', sans-serif" font-size="10" font-weight="600" fill="#734100" opacity="0.2" text-anchor="middle" letter-spacing="6">
    SUNSTONE &amp; BALTIC AMBER
  </text>
</svg>
